<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Apple-grade Channel Partner Management & Luxury Real Estate Sales Intelligence System with executive command centre, deal pipeline, and AI performance coaching." />
    <meta property="og:title" content="Pranay CP Intelligence Suite" />

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090b10] text-[#f1f5f9] antialiased selection:bg-amber-500/20 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatic fallback for static GitHub Pages hosting
      // If running on a static server/GitHub Pages and the root hasn't mounted in 600ms, route to built docs/
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          if (window.location.hostname.endsWith('github.io') || window.location.protocol === 'file:') {
            var currentPath = window.location.pathname;
            if (!currentPath.includes('/docs/')) {
              var target = currentPath.endsWith('/') ? currentPath + 'docs/' : currentPath + '/docs/';
              window.location.replace(target);
            }
          }
        }
      }, 600);
    </script>
  </body>
</html>
